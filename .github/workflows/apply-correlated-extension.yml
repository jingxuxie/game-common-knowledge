name: Apply correlated-certificate extension

on:
  push:
    branches:
      - agent/correlated-certificates-extension
    paths:
      - ".bootstrap_extension/ready"
  pull_request:
    branches:
      - main
    paths:
      - ".bootstrap_extension/**"
      - ".github/workflows/apply-correlated-extension.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/correlated-certificates-extension
      - name: Expand and commit extension
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .bootstrap_extension/ready ]]; then
            echo "Extension already applied."
            exit 0
          fi
          expected="$(cat .bootstrap_extension/ready)"
          cat .bootstrap_extension/part-* | base64 --decode > /tmp/correlated-extension.tar.gz
          actual="$(sha256sum /tmp/correlated-extension.tar.gz | awk '{print $1}')"
          test "$actual" = "$expected"
          tar -xzf /tmp/correlated-extension.tar.gz
          # GITHUB_TOKEN cannot rewrite workflow files. Preserve permanent CI
          # here and update it separately through the GitHub connector.
          git checkout HEAD -- .github/workflows/tests.yml
          rm -rf .bootstrap_extension
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add correlated-certificate theorem and shared-failure study"
          git push origin HEAD:agent/correlated-certificates-extension
