name: Bootstrap research repository

on:
  push:
    branches:
      - agent/initial-theory-experiments
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap.yml"
  pull_request:
    branches:
      - main
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/initial-theory-experiments
      - name: Expand research archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f bootstrap/part-00 ]]; then
            echo "Bootstrap archive already expanded."
            exit 0
          fi
          cat bootstrap/part-* | base64 --decode > /tmp/game-common-knowledge.tar.gz
          tar -xzf /tmp/game-common-knowledge.tar.gz
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build initial common-knowledge theory and experiments"
          git push origin HEAD:agent/initial-theory-experiments
