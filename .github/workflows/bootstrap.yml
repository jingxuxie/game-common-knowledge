name: Bootstrap research repository

on:
  push:
    branches:
      - agent/initial-theory-experiments
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap.yml"
  pull_request:
    branches:
      - main
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/initial-theory-experiments
      - name: Expand research archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f bootstrap/part-00 ]]; then
            echo "Bootstrap archive already expanded."
            exit 0
          fi
          python - <<'PY'
          import base64
          import pathlib
          import tarfile

          parts = sorted(pathlib.Path("bootstrap").glob("part-*"))
          encoded = "".join(path.read_text(encoding="utf-8").strip() for path in parts)
          payload = base64.b64decode(encoded, validate=True)
          archive = pathlib.Path("/tmp/game-common-knowledge.tar.gz")
          archive.write_bytes(payload)
          with tarfile.open(archive, "r:gz") as handle:
              handle.extractall(".")
          print(f"Expanded {len(parts)} parts into {len(payload)} archive bytes")
          PY
          # Add the permanent workflow later through the GitHub connector so this
          # one-time Actions token never needs workflow-write permission.
          rm -f .github/workflows/tests.yml
          rm -rf bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build initial common-knowledge theory and experiments"
          git push origin HEAD:agent/initial-theory-experiments
