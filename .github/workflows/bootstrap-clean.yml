name: Finalize and validate research artifact

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/submission-ready-common-knowledge

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Document AI-assisted development
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("paper/paper_body.tex")
          text = path.read_text(encoding="utf-8")
          old = (
              "These extensions preserve the central design question established here---"
              "what should become commonly observable---but require new algorithms.\n\n"
              "\\section{Conclusion}"
          )
          new = (
              "These extensions preserve the central design question established here---"
              "what should become commonly observable---but require new algorithms. "
              "AI-assisted tools supported drafting and code refactoring; the authors "
              "take responsibility for the final proofs, experiments, references, and claims.\n\n"
              "\\section{Conclusion}"
          )
          if new in text:
              print("Disclosure already present.")
          elif old in text:
              path.write_text(text.replace(old, new), encoding="utf-8")
              print("Inserted AI-assistance disclosure.")
          else:
              raise SystemExit("Could not locate disclosure insertion point")
          PY

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-build-isolation

      - name: Run tests and reproduce experiments
        run: |
          pytest -q
          python experiments/run_all.py
          python scripts/validate_results.py

      - name: Install document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-bibtex-extra poppler-utils

      - name: Build manuscripts
        run: make paper

      - name: Check manuscript PDFs
        shell: bash
        run: |
          set -euo pipefail
          test "$(pdfinfo paper/preprint.pdf | awk '/^Pages:/ {print $2}')" = "7"
          test "$(pdfinfo paper/supplement.pdf | awk '/^Pages:/ {print $2}')" = "5"
          if pdffonts paper/preprint.pdf | grep -q "Type 3"; then exit 1; fi
          if pdffonts paper/supplement.pdf | grep -q "Type 3"; then exit 1; fi

      - name: Commit final source and generated artifacts
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/paper_body.tex paper/preprint.pdf paper/supplement.pdf paper/generated_results.tex results figures
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Finalize disclosure and manuscript artifacts"
          git push origin HEAD:agent/submission-ready-common-knowledge
