name: Expand and validate research artifact

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/submission-ready-common-knowledge

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Expand source archive
        id: expand
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f bootstrap/part-00 ]]; then
            echo "expanded=false" >> "$GITHUB_OUTPUT"
            echo "Source archive is already expanded."
            exit 0
          fi
          cat bootstrap/part-* > /tmp/source.b64
          base64 --decode /tmp/source.b64 > /tmp/source.tar.gz
          echo "d7255d252fe2393099daf2e50b8f609e45d3b55d446e5969c96ccd36c54bc8de  /tmp/source.tar.gz" | sha256sum --check
          tar -xzf /tmp/source.tar.gz
          rm -rf bootstrap
          echo "expanded=true" >> "$GITHUB_OUTPUT"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-build-isolation

      - name: Run tests and reproduce experiments
        run: |
          pytest -q
          python experiments/run_all.py
          python scripts/validate_results.py

      - name: Install document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-bibtex-extra poppler-utils

      - name: Build manuscripts
        run: make paper

      - name: Check manuscript PDFs
        shell: bash
        run: |
          set -euo pipefail
          test "$(pdfinfo paper/preprint.pdf | awk '/^Pages:/ {print $2}')" = "7"
          test "$(pdfinfo paper/supplement.pdf | awk '/^Pages:/ {print $2}')" = "5"
          if pdffonts paper/preprint.pdf | grep -q "Type 3"; then exit 1; fi
          if pdffonts paper/supplement.pdf | grep -q "Type 3"; then exit 1; fi

      - name: Commit expanded artifact
        if: steps.expand.outputs.expanded == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build submission-ready common-knowledge artifact"
          git push origin HEAD:agent/submission-ready-common-knowledge
